# Development-only country proxy service. This does not implement full hardware
# deployment yet. No host ports, host networking, TUN device or NET_ADMIN.
name: onewifi-egress-lab
services:
  egress:
    image: onewifi/egress:dev
    build:
      context: ..
      dockerfile: runtime/Dockerfile.egress
      args:
        TARGETARCH: ${ONEWIFI_ARCH:-amd64}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: [/tmp:size=16m]
    volumes:
      - ${ONEWIFI_LAB_DATA:?set an absolute, dedicated lab data directory}:/data
    environment:
      ONEWIFI_EGRESS_HOST: onewifi-egress
    networks:
      control:
        aliases: [onewifi-egress]
      uplink: {}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  control:
    internal: true
  uplink: {}
