name: onewifi

services:
  control:
    image: ghcr.io/onecatx/onewifi-control:${ONEWIFI_IMAGE_TAG:?set a release tag such as v1.12.0}
    container_name: onewifi-control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The data directory is whatever folder the operator created, often owned by their
    # DSM account with mode 0700. Without these, root in this container is just
    # "other" there: it could neither enter it nor set its mode, and a folder made in
    # File Station failed to start. Control already holds the Docker socket.
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - ${ONEWIFI_DATA_DIR:?set an absolute NAS data directory}:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - pcscd:/run/pcscd
      - hardware-dbus:/run/dbus:ro
    ports:
      - ${ONEWIFI_HTTP_PORT:-10443}:8443
    environment:
      ONEWIFI_DATA: /data
      ONEWIFI_HOST_DATA: ${ONEWIFI_DATA_DIR:?set an absolute NAS data directory}
      ONEWIFI_PCSCD_VOLUME: onewifi-pcscd
      ONEWIFI_ENGINE_NETWORK: onewifi-engine
      ONEWIFI_ENGINE_DIRECT_NETWORK: onewifi-uplink
      ONEWIFI_ENGINE_IMAGE: ghcr.io/onecatx/onewifi-engine:${ONEWIFI_IMAGE_TAG:?set a release tag such as v1.12.0}
      ONEWIFI_EGRESS_TRANSPORT: socks5
      ONEWIFI_MANAGER_URL: https://onewifi-control:8443
      ONEWIFI_ADVERTISE_ADDR: ${ONEWIFI_ADVERTISE_ADDR:?set the NAS LAN address}
      ONEWIFI_HTTP_PORT: 8443
      ONEWIFI_RTP_BASE: ${ONEWIFI_RTP_BASE:-30000}
      # MMS picture conversion: how many pictures at once (default: the CPUs) and how much
      # memory, in MB, it may use (default: worked out from mem_limit). Empty means default.
      ONEWIFI_MMS_CONVERT_WORKERS: ${ONEWIFI_MMS_CONVERT_WORKERS:-}
      ONEWIFI_MMS_CONVERT_MEMORY: ${ONEWIFI_MMS_CONVERT_MEMORY:-}
      ONEWIFI_CONTAINER_STACK: "1"
      ONEWIFI_CONTROL_CONTAINER: onewifi-control
      ONEWIFI_HARDWARE_CONTAINER: onewifi-hardware
      ONEWIFI_EGRESS_CONTAINER: onewifi-egress
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      engine:
        aliases: [onewifi-control]
      management: {}
    depends_on:
      hardware:
        condition: service_healthy
      egress:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      io.onewifi.managed: "true"
      io.onewifi.component: control
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  hardware:
    image: ghcr.io/onecatx/onewifi-hardware:${ONEWIFI_IMAGE_TAG:?set a release tag such as v1.12.0}
    container_name: onewifi-hardware
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, DAC_OVERRIDE, KILL, NET_ADMIN, NET_RAW, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    pids_limit: 64
    mem_limit: 256m
    volumes:
      - /dev:/dev
      - ${ONEWIFI_DATA_DIR:?set an absolute NAS data directory}:/data
      - pcscd:/run/pcscd
      - hardware-dbus:/run/dbus
      - networkmanager-state:/var/lib/NetworkManager
      - networkmanager-connections:/etc/NetworkManager/system-connections
      # ModemManager must switch qmi_wwan's raw_ip mode. /sys/class/net entries
      # resolve into /sys/devices, so this is the narrow persistent subtree that
      # survives a modem reset; the rest of sysfs stays read-only.
      - /sys/devices:/sys/devices:rw
    device_cgroup_rules:
      - "c 188:* rwm"
      - "c 180:* rwm"
      # USB character devices used by physical CCID readers.
      - "c 189:* rwm"
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /var/lib/ModemManager:rw,nosuid,nodev,size=8m
      - /var/lib/mdd-vpcd:rw,nosuid,nodev,exec,size=32m
      - /etc/reader.conf.d:rw,nosuid,nodev,size=1m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      io.onewifi.managed: "true"
      io.onewifi.component: hardware
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

  egress:
    image: ghcr.io/onecatx/onewifi-egress:${ONEWIFI_IMAGE_TAG:?set a release tag such as v1.12.0}
    container_name: onewifi-egress
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # Enter an operator-owned data directory (see control). Every file inside is created
    # by root, so owner permissions already give this container access to them.
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    volumes:
      - ${ONEWIFI_DATA_DIR:?set an absolute NAS data directory}:/data
    environment:
      ONEWIFI_EGRESS_HOST: onewifi-egress
      PYTHONDONTWRITEBYTECODE: "1"
    extra_hosts:
      # A subscription may be served by this NAS under its public DNS name.
      # Keep the original URL/Host header while avoiding public hairpin routing.
      - ${ONEWIFI_NAS_HOSTNAME:-host.docker.internal}:host-gateway
    networks:
      engine:
        aliases: [onewifi-egress]
      uplink: {}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      io.onewifi.managed: "true"
      io.onewifi.component: egress
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  pcscd:
    name: onewifi-pcscd
  hardware-dbus:
    name: onewifi-hardware-dbus
  networkmanager-state:
    name: onewifi-networkmanager-state
  networkmanager-connections:
    name: onewifi-networkmanager-connections

networks:
  engine:
    name: onewifi-engine
    internal: true
  management:
    name: onewifi-management
  uplink:
    name: onewifi-uplink
